[workspace]
resolver = "2"
members = [
  "access-control",
  "asset-registry",
  "compliance",
  "rwa-token",
  "investment",
  "escrow",
  "revenue-distribution",
  "leasing",
  "marketplace",
  "governance",
  "withdrawals",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/aerospace-rwa/aerospace-rwa"

[workspace.dependencies]
soroban-sdk = "30.0.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
