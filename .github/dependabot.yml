version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      next:
        patterns: ['next', 'react', 'react-dom']
      tooling:
        patterns: ['typescript', 'vitest', 'prettier', '@playwright/test']

  - package-ecosystem: cargo
    directory: /contracts
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      soroban:
        patterns: ['soroban-*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
